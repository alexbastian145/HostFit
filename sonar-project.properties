# Used when running sonar-scanner directly. With Maven, `mvn sonar:sonar` reads the same values from pom.xml.
sonar.projectKey=hostfit
sonar.projectName=HostFit
sonar.sources=src/main/java,src/main/resources
sonar.tests=src/test/java
sonar.java.binaries=target/classes
sonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml
sonar.exclusions=**/config/**,**/HostFitApplication.java
