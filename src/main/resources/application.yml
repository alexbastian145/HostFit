spring:
  application:
    name: hostfit
  datasource:
    # Zero-setup default: a file-based H2 database in ./data. Use the "mysql" profile for MySQL.
    url: jdbc:h2:file:./data/hostfit;MODE=MySQL
    username: sa
    password:
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
  thymeleaf:
    cache: false
  messages:
    basename: messages

server:
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info

hostfit:
  admin:
    username: ${HOSTFIT_ADMIN_USERNAME:admin}
    password: ${HOSTFIT_ADMIN_PASSWORD:admin123}
  fx:
    usd-inr: ${HOSTFIT_USD_INR:88.0}
    auto-refresh: ${HOSTFIT_FX_AUTO_REFRESH:false}
  crawler:
    enabled: ${HOSTFIT_CRAWLER_ENABLED:true}
    cron: ${HOSTFIT_CRAWLER_CRON:0 0 */6 * * *}
    user-agent: "HostFitBot/1.0 (student project; price comparison)"
    timeout-seconds: 20
    delay-ms: 1500
    respect-robots: true
    stale-days: 14
  seed:
    enabled: true
